# ============================================================================
# 每日挑战词汇配置（示例 / 模板）
# ----------------------------------------------------------------------------
# 这是 daily_challenges.yaml 的格式样本。请：
#   1. 复制为 backend/data/daily_challenges.yaml
#   2. 按需填入真实谜底（**该文件不进 Git**，避免提前泄露给玩家）
#
# 字段说明
# - key   : 日期（YYYY-MM-DD），按 Asia/Shanghai 时区
# - value : 当日谜底词汇，必须存在于 backend/data/target_words.txt
#
# 工作机制
#   1. 配置过的日期 → 直接使用 value 作为谜底
#   2. 未配置的日期 → 自动从 backend/data/daily_pool.txt 中按 HMAC 兜底抽取
#   3. 配置词不在 target_words.txt 中时，启动时打告警，运行期降级为 HMAC 兜底
#
# 注意事项
#   - 改动后需要重启服务才生效（容器需 docker compose up -d --force-recreate）
#   - 谜底词不能包含空格 / 标点；建议 2-4 个汉字
#   - 起始日期：服务首次发布之日，早于此不可回溯
# ============================================================================

schedule:
  # —— 以下仅为格式示例，请替换为真实排期 ——
  "2099-01-01": 苹果
  "2099-01-02": 月亮
  "2099-01-03": 钢琴
