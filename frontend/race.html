<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent 猜词 · 中文语义猜词</title>
  <link rel="stylesheet" href="race.css" />
</head>
<body>
  <header class="race-header">
    <div class="brand">
      <span class="dot"></span>
      <h1>Agent 猜词</h1>
      <span class="sub" id="sub">你 vs DeepSeek · 比谁猜中的次数少</span>
    </div>
    <div class="controls">
      <span id="status" class="status">未开始</span>
      <button id="btn-mode" class="btn" type="button">模式：人机对战</button>
      <button id="btn-new" class="btn primary">开始新对局</button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main class="race-grid">
    <section class="panel human">
      <div class="panel-head">
        <h2 id="human-title">你</h2>
        <span class="meta" id="human-meta">猜测 <b id="human-count">0</b> · 最佳 <b id="human-best">-</b></span>
        <button id="btn-giveup" class="btn small" type="button">放弃</button>
      </div>

      <!-- 出题模式：输入答案，让 Agent 猜 -->
      <div id="challenge-setup" class="guess-form" hidden>
        <input id="challenge-input" placeholder="输入一个词作为答案，例如：刺猬" autocomplete="off" />
        <button id="btn-challenge-start" class="btn" type="button">让 Agent 猜</button>
      </div>
      <div id="challenge-error" class="form-error" hidden></div>
      <div id="challenge-tip" class="status-note" hidden>
        你不参与猜测，只是出题并旁观 DeepSeek 解题；可以实时看到它的思考与工具调用。
      </div>

      <!-- 对战模式：人类猜词 -->
      <form id="human-form" class="guess-form">
        <input id="human-input" placeholder="输入一个中文词，回车提交" autocomplete="off" />
        <button class="btn" type="submit">猜</button>
      </form>
      <div id="human-error" class="form-error" hidden></div>
      <div class="table-wrap" id="human-table-wrap">
        <table class="result">
          <thead><tr><th>#</th><th>词</th><th>相似度</th><th>rank</th></tr></thead>
          <tbody id="human-rows"><tr class="empty"><td colspan="4">还没有猜测</td></tr></tbody>
        </table>
      </div>
    </section>

    <section class="panel agent">
      <div class="panel-head">
        <h2>DeepSeek Agent</h2>
        <span class="meta">猜测 <b id="agent-count">0</b> · 最佳 <b id="agent-best">-</b> · 步数 <b id="agent-steps">0</b></span>
        <button id="btn-toggle-agent" class="btn small" type="button">看 Agent 思考</button>
      </div>
      <div id="agent-mask" class="agent-mask">
        <div class="mask-big">🔒 Agent 正在独立思考</div>
        <div class="mask-sub">它的思维链、工具调用和猜测结果默认遮蔽，避免偷看。可点右上角查看，或等对局结束后自动揭晓。</div>
      </div>
      <div id="agent-detail" class="agent-detail hidden">
        <div id="agent-log" class="agent-log"><div class="empty">等待开始…</div></div>
        <div class="table-wrap">
          <table class="result">
            <thead><tr><th>#</th><th>词</th><th>相似度</th><th>rank</th></tr></thead>
            <tbody id="agent-rows"><tr class="empty"><td colspan="4">还没有猜测</td></tr></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script>
    window.SEMANTLE_API_BASE = window.SEMANTLE_API_BASE || "http://127.0.0.1:8001";
  </script>
  <script src="race.js"></script>
</body>
</html>
